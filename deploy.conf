WORKER_DIR=worker
STAMP_FILES="frontend/js/config.js frontend/sw.js frontend/index.html"
VERIFY_URL=https://cadence.mishabhi.workers.dev
VERIFY_PATH=/js/config.js
GIT_COMMIT=0

# The browser cannot resolve a bare specifier without a bundler, so the page
# half of webpush-edge is served from the assets dir. Refreshed on each deploy
# so the package stays the single source. client.js imports ./sw.js — both.
VENDOR_COPY="worker/node_modules/webpush-edge/src/client.js:frontend/js/vendor/webpush-edge/client.js worker/node_modules/webpush-edge/src/sw.js:frontend/js/vendor/webpush-edge/sw.js"
